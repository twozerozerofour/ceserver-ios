name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (official repos)
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          test -x "$HOME/theos/bin/dm.pl" || echo "::warning::dm.pl not executable"

      - name: Install ldid (signing)
        run: brew install ldid

      - name: Build jailbreak tool
        run: make -C ceserver-ios/jailbreak clean package FINALPACKAGE=1

      - name: Build jailed dylib
        run: make -C ceserver-ios/jailed clean package FINALPACKAGE=1

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find ceserver-ios -name '*.deb' -exec cp -v {} dist/ \;
          find ceserver-ios -path '*/.theos/obj/*' \( -name 'ceserver.dylib' -o -name 'ceserver' \) -exec cp -v {} dist/ \; || true
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ceserver-ios-${{ github.sha }}
          path: dist/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
